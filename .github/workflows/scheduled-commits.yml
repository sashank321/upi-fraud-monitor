name: Scheduled project commits

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

concurrency:
  group: staged-project-publication
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
      - name: Verify staged files or publish due commits
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_EVENT: ${{ github.event_name }}
        run: python3 .github/publish.py
